name: Tests (card)

on:
  push:
    branches: [main]
    paths:
      - "card/**"
      - ".github/workflows/tests-card.yml"
  pull_request:
    paths:
      - "card/**"
      - ".github/workflows/tests-card.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify bundle exists in card/dist
        run: test -s dist/smart-alarm-card.js
      - name: Verify bundle was copied into integration/frontend
        run: test -s ../custom_components/smart_alarm/frontend/smart-alarm-card.js
      - run: npm run lint --if-present
      - run: npm test --if-present
