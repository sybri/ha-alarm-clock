enable:
  name: Enable
  description: Enable an alarm (state idle, recompute next_trigger).
  target:
    entity:
      integration: smart_alarm
      domain: sensor

disable:
  name: Disable
  description: Disable an alarm.
  target:
    entity:
      integration: smart_alarm
      domain: sensor

set_day_time:
  name: Set day time
  description: Set (and enable) the alarm time for a given weekday.
  target:
    entity:
      integration: smart_alarm
      domain: sensor
  fields:
    day:
      name: Day
      description: Weekday (0=Monday .. 6=Sunday).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 6
          mode: box
    time:
      name: Time
      description: Alarm time in HH:MM format.
      required: true
      example: "07:00"
      selector:
        text:

clear_day:
  name: Clear day
  description: Disable the alarm for a given weekday.
  target:
    entity:
      integration: smart_alarm
      domain: sensor
  fields:
    day:
      name: Day
      description: Weekday (0=Monday .. 6=Sunday).
      required: true
      example: 5
      selector:
        number:
          min: 0
          max: 6
          mode: box

snooze:
  name: Snooze
  description: Snooze a currently-firing alarm.
  target:
    entity:
      integration: smart_alarm
      domain: sensor

stop:
  name: Stop
  description: Stop a currently-firing or snoozed alarm.
  target:
    entity:
      integration: smart_alarm
      domain: sensor

trigger_now:
  name: Trigger now
  description: Force the alarm to fire immediately (test button).
  target:
    entity:
      integration: smart_alarm
      domain: sensor
